name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: self-hosted
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up C to WebAssembly compiler
        run: bash ../scripts/setup-emsdk.sh
      - run: npm ci
      - name: Test native and WebAssembly builds
        run: |
          source ../.tools/emsdk/emsdk_env.sh
          npm run test:c
      - name: Build site
        run: |
          source ../.tools/emsdk/emsdk_env.sh
          npm run build
