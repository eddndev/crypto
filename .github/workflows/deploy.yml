name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: self-hosted
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Check OpenSSL development dependencies
        run: |
          if ! pkg-config --atleast-version=3.0 openssl; then
            sudo apt-get update
            sudo apt-get install -y pkg-config libssl-dev perl
          fi
      - name: Cache OpenSSL WebAssembly library
        uses: actions/cache@v4
        with:
          path: .tools/openssl-wasm-3.5.8
          key: openssl-wasm-${{ runner.os }}-${{ runner.arch }}-emsdk-4.0.15-${{ hashFiles('scripts/setup-openssl-wasm.sh') }}
      - name: Set up C to WebAssembly compiler
        run: bash ../scripts/setup-emsdk.sh

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          source ../.tools/emsdk/emsdk_env.sh
          export PATH="$(dirname "$EMSDK_NODE"):$PATH"
          npm run test:c
          npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=crypto-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
